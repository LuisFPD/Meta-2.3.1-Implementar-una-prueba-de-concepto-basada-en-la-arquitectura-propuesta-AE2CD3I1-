<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard del autor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>window.VueDemi = Vue</script>
<script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f8f8;
  --white: #fff;
  --border: #e4e4e7;
  --text: #18181b;
  --muted: #71717a;
  --light: #f4f4f5;
  --blue: #2563eb;
  --radius: 10px;
  --font: 'Inter', sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font-family: var(--font); cursor: pointer; }
input, select { font-family: var(--font); }
 
.wrap { max-width: 660px; margin: 0 auto; padding: 32px 20px 64px; }
 
/* Header */
.brand { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 28px; }
 
/* Primary button */
.btn-new { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px 20px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; margin-bottom: 32px; transition: opacity .15s; }
.btn-new:hover { opacity: .87; }
 
/* Section label */
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
 
/* Manuscript list */
.ms-list { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--white); margin-bottom: 28px; }
.ms-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); transition: background .1s; }
.ms-row:last-child { border-bottom: none; }
.ms-row:hover { background: var(--light); }
.ms-info { flex: 1; min-width: 0; }
.ms-title { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.ms-date { font-size: 12px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 100px; white-space: nowrap; flex-shrink: 0; }
.b-enviado   { background: #eff6ff; color: #1d4ed8; }
.b-revision  { background: #fef9c3; color: #a16207; }
.b-decision  { background: #fff7ed; color: #c2410c; }
.b-aceptado  { background: #f0fdf4; color: #15803d; }
.b-rechazado { background: #fff1f2; color: #be123c; }
.btn-delete { background: none; border: none; padding: 4px; color: #d1d5db; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color .15s, background .15s; }
.btn-delete:hover { color: #ef4444; background: #fff1f2; }
 
/* Empty state */
.empty { border: 1px dashed var(--border); border-radius: var(--radius); background: var(--white); padding: 52px 24px; text-align: center; margin-bottom: 28px; }
.empty svg { color: #d4d4d8; margin-bottom: 14px; }
.empty-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--muted); }
 
/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--white); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,.1); }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.modal-sub   { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.field input, .field select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px; color: var(--text); background: var(--white); outline: none; transition: border-color .15s; }
.field input:focus, .field select:focus { border-color: var(--blue); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { background: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-size: 13px; color: var(--muted); transition: background .15s; }
.btn-cancel:hover { background: var(--light); }
.btn-submit { background: var(--blue); color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: opacity .15s; }
.btn-submit:hover:not([disabled]) { opacity: .87; }
.btn-submit[disabled] { opacity: .4; cursor: not-allowed; }
 
/* Toast */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; pointer-events: none; }
.toast { background: #18181b; color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 8px; white-space: nowrap; }
 
/* Transitions */
.fade-enter-active, .fade-leave-active { transition: opacity .2s; }
.fade-enter-from, .fade-leave-to { opacity: 0; }
 
@media (max-width: 480px) {
  .wrap { padding: 18px 14px 48px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const { createApp, ref, reactive, computed } = Vue
const { createPinia, defineStore } = Pinia
 
const useAuthorStore = defineStore('author', () => {
  const manuscripts = ref([
    { id: 1, title: 'Prueba de artículo enviado',     date: '01/04/2025', status: 'Enviado' },
    { id: 2, title: 'Prueba de artículo en revisión', date: '15/03/2025', status: 'En revisión' },
    { id: 3, title: 'Prueba de artículo en decisión', date: '02/02/2025', status: 'Decisión' },
    { id: 4, title: 'Prueba de artículo aceptado',    date: '18/01/2025', status: 'Aceptado' },
    { id: 5, title: 'Prueba de artículo rechazado',   date: '05/12/2024', status: 'Rechazado' },
  ])
 
  const toasts = ref([])
  const showNewModal = ref(false)
 
  function addManuscript(title, status, date) {
    manuscripts.value.unshift({ id: Date.now(), title, status, date })
    pushToast('Manuscrito agregado')
  }
 
  function removeManuscript(id) {
    manuscripts.value = manuscripts.value.filter(m => m.id !== id)
    pushToast('Manuscrito eliminado')
  }
 
  function pushToast(msg) {
    const id = Date.now()
    toasts.value.push({ id, msg })
    setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id) }, 3000)
  }
 
  return { manuscripts, toasts, showNewModal, addManuscript, removeManuscript, pushToast }
})
 
const App = {
  setup() {
    const store = useAuthorStore()
    const form = reactive({ title: '', status: '', date: '' })
 
    const canSubmit = computed(() => form.title.trim() && form.status && form.date)
 
    const badgeClass = (s) => ({
      'Enviado':     'b-enviado',
      'En revisión': 'b-revision',
      'Decisión':    'b-decision',
      'Aceptado':    'b-aceptado',
      'Rechazado':   'b-rechazado',
    }[s] || 'b-enviado')
 
    function closeModal() {
      store.showNewModal = false
      form.title = ''; form.status = ''; form.date = ''
    }
 
    function submit() {
      if (!canSubmit.value) return
      const [y, m, d] = form.date.split('-')
      store.addManuscript(form.title.trim(), form.status, `${d}/${m}/${y}`)
      closeModal()
    }
 
    return { store, form, canSubmit, badgeClass, closeModal, submit }
  },
  template: `
  <div class="wrap">
    <div class="brand">Dashboard del autor</div>
 
    <button class="btn-new" @click="store.showNewModal = true">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/>
      </svg>
      Enviar nuevo manuscrito
    </button>
 
    <div class="section-label">Mis manuscritos</div>
 
    <div v-if="store.manuscripts.length === 0" class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125
             0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0
             12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125
             1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0
             1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
      </svg>
      <div class="empty-title">Aún no tienes manuscritos enviados</div>
      <div class="empty-sub">Usa el botón de arriba para agregar tu primer trabajo.</div>
    </div>
 
    <div v-else class="ms-list">
      <div v-for="ms in store.manuscripts" :key="ms.id" class="ms-row">
        <div class="ms-info">
          <div class="ms-title">{{ ms.title }}</div>
          <div class="ms-date">{{ ms.date }}</div>
        </div>
        <span class="badge" :class="badgeClass(ms.status)">{{ ms.status }}</span>
        <button class="btn-delete" @click="store.removeManuscript(ms.id)" title="Eliminar">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
 
  <Transition name="fade">
    <div v-if="store.showNewModal" class="overlay" @click.self="closeModal">
      <div class="modal">
        <div class="modal-title">Nuevo manuscrito</div>
        <div class="modal-sub">Completa los campos para agregar el manuscrito.</div>
        <div class="field">
          <label>Nombre del manuscrito</label>
          <input v-model="form.title" placeholder="Título del manuscrito" maxlength="150" @keyup.enter="submit"/>
        </div>
        <div class="field">
          <label>Estado de revisión</label>
          <select v-model="form.status">
            <option value="" disabled>Seleccionar estado…</option>
            <option>Enviado</option>
            <option>En revisión</option>
            <option>Decisión</option>
            <option>Aceptado</option>
            <option>Rechazado</option>
          </select>
        </div>
        <div class="field">
          <label>Fecha</label>
          <input v-model="form.date" type="date"/>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" @click="closeModal">Cancelar</button>
          <button class="btn-submit" :disabled="!canSubmit" @click="submit">Agregar</button>
        </div>
      </div>
    </div>
  </Transition>
 
  <Transition name="fade">
    <div v-if="store.toasts.length" class="toast-wrap">
      <div class="toast">{{ store.toasts[store.toasts.length - 1].msg }}</div>
    </div>
  </Transition>
  `
}
 
const app = createApp(App)
app.use(createPinia())
app.mount('#app')
</script>
</body>
</html>
