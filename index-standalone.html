<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel del Editor Jefe</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; font-size: 15px; }

.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }

/* Métricas */
.metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.metric-card { background: white; border-radius: 10px; padding: 16px; border: 1px solid #e5e5e5; }
.metric-label { font-size: 12px; color: #888; margin-bottom: 6px; }
.metric-value { font-size: 28px; font-weight: 600; }
.c-default  { color: #111; }
.c-yellow   { color: #f59e0b; }
.c-green    { color: #22c55e; }
.c-red      { color: #ef4444; }
.c-blue     { color: #3b82f6; }

.avg-card { background: white; border-radius: 10px; padding: 16px; border: 1px solid #e5e5e5; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
.avg-label { font-size: 13px; color: #888; }
.avg-value { font-size: 22px; font-weight: 600; color: #3b82f6; }

/* Listas */
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 8px; }
.list-card { background: white; border-radius: 10px; border: 1px solid #e5e5e5; overflow: hidden; margin-bottom: 28px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #f0f0f0; }
.list-item:last-child { border-bottom: none; }

/* Cuellos de botella */
.bn-title { flex: 1; font-size: 14px; line-height: 1.3; }
.bn-title small { display: block; font-size: 11px; color: #aaa; margin-top: 2px; }
.bn-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.bn-critical { background: #fee2e2; color: #ef4444; }
.bn-warn     { background: #fef3c7; color: #d97706; }
.bn-ok       { background: #f0fdf4; color: #16a34a; }

/* Editores */
.ed-avatar { width: 34px; height: 34px; border-radius: 50%; background: #e0e7ff; color: #3b82f6; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ed-info { flex: 1; }
.ed-name { font-size: 14px; font-weight: 500; }
.ed-area { font-size: 11px; color: #aaa; margin-top: 1px; }
.ed-load { font-size: 13px; color: #888; white-space: nowrap; }
.ed-load strong { color: #111; }

@media (max-width: 420px) {
  .metric-value { font-size: 24px; }
  .ed-load { font-size: 12px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>window.VueDemi = Vue</script>
<script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.js"></script>
<script>
const { createApp, computed } = Vue
const { createPinia, defineStore } = Pinia

/* ── Store ── */
const useStore = defineStore('editorial', () => {
  const manuscritos = Vue.ref([
    { id: 1,  titulo: 'Microbioma Intestinal y Trastornos del Espectro Autista',           editor: 'Oscar Leonel Rodriguez Araujo',  estado: 'en_proceso',  lastMove: '2026-02-05' },
    { id: 2,  titulo: 'Impacto del Cambio Climático en la Biodiversidad Costera',           editor: 'Axel Eduardo Jimenez Perez',   estado: 'en_proceso',  lastMove: '2026-02-12' },
    { id: 3,  titulo: 'Redes Neuronales Cuánticas para Criptografía Post-Cuántica',         editor: 'Oscar Leonel Rodriguez Araujo',   estado: 'en_proceso',  lastMove: '2026-02-18' },
    { id: 4,  titulo: 'Políticas de Privacidad Diferencial en Sistemas de Salud',           editor: 'Eduardo Hurtado Quintero',     estado: 'en_proceso',  lastMove: '2026-03-01' },
    { id: 5,  titulo: 'Análisis de Sentimientos en Redes Sociales de Crisis',               editor: 'Eduardo Hurtado Quintero',   estado: 'en_proceso',  lastMove: '2026-03-10' },
    { id: 6,  titulo: 'Detección de Anomalías en Sistemas SCADA',                           editor: 'Luis Fernando Prieto Duarte',     estado: 'en_proceso',  lastMove: '2026-02-22' },
    { id: 7,  titulo: 'Optimización Multi-objetivo en Logística con IA',                    editor: 'Luis Fernando Prieto Duarte',   estado: 'en_proceso',  lastMove: '2026-02-28' },
    { id: 8,  titulo: 'Arquitecturas Transformer para Series Temporales en Finanzas',       editor: 'Ricardo Emmanuel Romo Ruiz',   estado: 'en_proceso',  lastMove: '2026-03-19' },
    { id: 9,  titulo: 'Síntesis de Nanomateriales Bidimensionales para Energía',           editor: 'Luz María Jacobo Aldrete',     estado: 'aceptado',    lastMove: '2026-03-10' },
    { id: 10, titulo: 'Metacognición en Entornos de Aprendizaje Híbrido',                   editor: 'Dra. Sofía Mendoza',  estado: 'aceptado',    lastMove: '2026-03-08' },
    { id: 11, titulo: 'Terapia Génica CRISPR-Cas9 para Enfermedades Raras',                editor: 'Ricardo Emmanuel Romo Ruiz',                  estado: 'recibido',    lastMove: '2026-03-18' },
    { id: 12, titulo: 'Impacto Socioeconómico de la Automatización en Manufactura',        editor: 'Oscar Leonel Rodriguez Araujo',                  estado: 'recibido',    lastMove: '2026-03-20' },
    { id: 13, titulo: 'Evaluación de Biomarcadores en Diagnóstico Temprano de Parkinson',  editor: 'Ricardo Emmanuel Romo Ruiz',   estado: 'rechazado',   lastMove: '2026-03-05' },
    { id: 14, titulo: 'Análisis de Fusiones Corporativas en el Sector Tecnológico',        editor: 'Luz María Jacobo Aldrete',   estado: 'rechazado',   lastMove: '2026-02-28' },
    { id: 15, titulo: 'Federación de Datos Clínicos con Aprendizaje Federado',             editor: 'Luz María Jacobo Aldrete',  estado: 'aceptado',    lastMove: '2026-03-12' },
    { id: 16, titulo: 'Modelos Computacionales para Resistencia a Antibióticos',           editor: 'Luis Fernando Prieto Duarte',  estado: 'rechazado',   lastMove: '2026-03-01' },
  ])

  const editores = Vue.ref([
    { initials: 'LA', nombre: 'Oscar Leonel Rodriguez Araujo',   area: 'Product Owner', completados: 5 },
    { initials: 'AJ', nombre: 'Axel Eduardo Jimenez Perez',    area: 'Developer',     completados: 3 },
    { initials: 'EQ', nombre: 'Eduardo Hurtado Quintero',     area: 'Developer', completados: 3 },
    { initials: 'LP', nombre: 'Luis Fernando Prieto Duarte',     area: 'Scrum Master',            completados: 6 },
    { initials: 'MA', nombre: 'Luz María Jacobo Aldrete', area: 'Developer',      completados: 2 },
    { initials: 'RR', nombre: 'Ricardo Emmanuel Romo Ruiz', area: 'Developer',    completados: 2 },
  ])

  function diasSinMovimiento(fecha) {
    return Math.floor((new Date() - new Date(fecha)) / 86400000)
  }

  const metricas = computed(() => ({
    total:      manuscritos.value.length,
    enProceso:  manuscritos.value.filter(m => m.estado === 'en_proceso' || m.estado === 'recibido').length,
    aceptados:  manuscritos.value.filter(m => m.estado === 'aceptado').length,
    rechazados: manuscritos.value.filter(m => m.estado === 'rechazado').length,
  }))

  const tiempoPromedio = computed(() => {
    const terminados = manuscritos.value.filter(m => ['aceptado','rechazado'].includes(m.estado))
    if (!terminados.length) return 0
    const total = terminados.reduce((s, m) => s + diasSinMovimiento(m.lastMove), 0)
    return Math.round(total / terminados.length)
  })

  const cuellos = computed(() =>
    manuscritos.value
      .filter(m => m.estado === 'en_proceso')
      .map(m => ({ ...m, dias: diasSinMovimiento(m.lastMove) }))
      .sort((a, b) => b.dias - a.dias)
      .slice(0, 5)
  )

  const cargaEditores = computed(() =>
    editores.value.map(e => ({
      ...e,
      activos: manuscritos.value.filter(m => m.editor === e.nombre && m.estado === 'en_proceso').length,
    }))
  )

  return { metricas, tiempoPromedio, cuellos, cargaEditores }
})

/* ── App ── */
const App = {
  setup() {
    const store = useStore()

    function badgeClass(dias) {
      if (dias >= 30) return 'bn-badge bn-critical'
      if (dias >= 14) return 'bn-badge bn-warn'
      return 'bn-badge bn-ok'
    }

    return { store, badgeClass }
  },
  template: `
<div class="container">
  <h1>Panel del Editor Jefe</h1>

  <!-- Métricas -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Total recibidos</div>
      <div class="metric-value c-default">{{ store.metricas.total }}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">En proceso</div>
      <div class="metric-value c-yellow">{{ store.metricas.enProceso }}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Aceptados</div>
      <div class="metric-value c-green">{{ store.metricas.aceptados }}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Rechazados</div>
      <div class="metric-value c-red">{{ store.metricas.rechazados }}</div>
    </div>
  </div>

  <div class="avg-card">
    <span class="avg-label">Tiempo promedio de revisión</span>
    <span class="avg-value">{{ store.tiempoPromedio }} días</span>
  </div>

  <!-- Cuellos de botella -->
  <div class="section-title">Cuellos de botella</div>
  <div class="list-card">
    <div v-for="m in store.cuellos" :key="m.id" class="list-item">
      <div class="bn-title">
        {{ m.titulo }}
        <small>{{ m.editor ?? 'Sin asignar' }}</small>
      </div>
      <span :class="badgeClass(m.dias)">{{ m.dias }} días</span>
    </div>
  </div>

  <!-- Editores de sección -->
  <div class="section-title">Editores de sección</div>
  <div class="list-card">
    <div v-for="e in store.cargaEditores" :key="e.nombre" class="list-item">
      <div class="ed-avatar">{{ e.initials }}</div>
      <div class="ed-info">
        <div class="ed-name">{{ e.nombre }}</div>
        <div class="ed-area">{{ e.area }}</div>
      </div>
      <div class="ed-load"><strong>{{ e.activos }}</strong> activos · {{ e.completados }} completados</div>
    </div>
  </div>
</div>
  `
}

const app = createApp(App)
app.use(createPinia())
app.mount('#app')
</script>
</body>
</html>
