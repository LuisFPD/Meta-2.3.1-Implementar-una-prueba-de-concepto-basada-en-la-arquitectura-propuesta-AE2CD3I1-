<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard del revisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>window.VueDemi = Vue</script>
<script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f8f8;
  --white: #fff;
  --border: #e4e4e7;
  --border-hover: #a1a1aa;
  --text: #18181b;
  --muted: #71717a;
  --light: #f4f4f5;
  --surface-2: #f0f0f1;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --green: #16a34a;
  --green-soft: #f0fdf4;
  --yellow-text: #a16207;
  --yellow-soft: #fef9c3;
  --orange: #c2410c;
  --orange-soft: #fff7ed;
  --red: #be123c;
  --red-soft: #fff1f2;
  --radius: 10px;
  --font: 'Inter', sans-serif;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font-family: var(--font); cursor: pointer; }

/* Layout */
.wrap { max-width: 700px; margin: 0 auto; padding: 32px 20px 64px; }

/* Topbar */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.brand  { font-size: 18px; font-weight: 600; color: var(--text); }
.offline-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 500; padding: 3px 10px;
  border-radius: 100px; background: var(--blue-soft); color: var(--blue);
  border: 1px solid #bfdbfe;
}
.offline-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Section */
.section { margin-bottom: 36px; }
.section-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin-bottom: 10px;
}
.count-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 100px; }
.count-badge.orange { background: var(--orange-soft); color: var(--orange); }
.count-badge.blue   { background: var(--blue-soft);   color: var(--blue); }
.count-badge.green  { background: var(--green-soft);  color: var(--green); }

/* Empty state */
.empty { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--white); padding: 20px 16px; color: var(--muted); }
.empty svg { flex-shrink: 0; color: #d4d4d8; }
.empty-text { font-size: 13px; }

/* ── Invitation cards ── */
.cards-list { display: flex; flex-direction: column; gap: 10px; }
.inv-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  border-left: 3px solid var(--blue);
  transition: box-shadow .15s;
}
.inv-card:hover { box-shadow: var(--shadow); }
.inv-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 10px; }
.inv-meta  { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 100px; background: var(--light); color: var(--muted); border: 1px solid var(--border); }
.chip-offline { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-soft); color: var(--blue); border-color: #bfdbfe; }
.inv-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border); }
.respond-by { font-size: 11px; color: var(--muted); }
.inv-actions { display: flex; gap: 8px; }
.btn-accept, .btn-decline {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 500; padding: 5px 12px;
  border-radius: 6px; border: 1px solid; transition: opacity .15s;
}
.btn-accept { background: var(--green-soft); color: var(--green); border-color: #bbf7d0; }
.btn-decline { background: var(--light); color: var(--muted); border-color: var(--border); }
.btn-decline:hover { background: var(--red-soft); color: var(--red); border-color: #fecdd3; opacity: 1; }

/* ── Table (active + completed reviews) ── */
.table-box { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--white); }
.table-head {
  display: grid; grid-template-columns: 1fr 130px 90px;
  padding: 8px 16px; background: var(--light); border-bottom: 1px solid var(--border);
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); gap: 12px;
}
.table-row {
  display: grid; grid-template-columns: 1fr 130px 90px;
  align-items: center; gap: 12px; padding: 13px 16px;
  border-bottom: 1px solid var(--border); transition: background .1s;
}
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: var(--light); }
.completed-row { grid-template-columns: 1fr auto; }
.row-urgent { background: #fff9f9; border-left: 3px solid var(--red); }
.row-urgent:hover { background: var(--red-soft); }

/* Columns */
.col-title   { min-width: 0; }
.col-deadline { display: flex; align-items: center; }
.col-offline  { display: flex; align-items: center; }
.rev-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.rev-area  { font-size: 11px; color: var(--muted); }

/* Progress bar */
.prog-wrap  { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.prog-bar   { flex: 1; height: 3px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.prog-fill  { height: 100%; border-radius: 3px; transition: width .5s ease; }
.fill-normal { background: var(--blue); }
.fill-urgent { background: var(--red); }
.prog-label { font-size: 10px; color: var(--muted); flex-shrink: 0; }

/* DeadlineBar */
.deadline-bar { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; white-space: nowrap; }
.deadline-bar.urgent  { background: var(--red-soft);    color: var(--red); }
.deadline-bar.warning { background: var(--orange-soft); color: var(--orange); }
.deadline-bar.ok      { background: var(--green-soft);  color: var(--green); }

/* Offline chip */
.offline-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 100px; background: var(--blue-soft); color: var(--blue); border: 1px solid #bfdbfe; }
.no-offline { font-size: 12px; color: #d4d4d8; }

/* Verdict badge */
.verdict-badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 100px; white-space: nowrap; flex-shrink: 0; }
.v-accept { background: var(--green-soft);  color: var(--green); }
.v-minor  { background: var(--blue-soft);   color: var(--blue); }
.v-major  { background: var(--orange-soft); color: var(--orange); }
.v-reject { background: var(--red-soft);    color: var(--red); }

/* Toast */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; }
.toast { background: var(--text); color: var(--white); padding: 10px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.18); }

/* Fade transition */
.fade-enter-active, .fade-leave-active { transition: opacity .2s ease; }
.fade-enter-from, .fade-leave-to { opacity: 0; }

/* Responsive */
@media (max-width: 540px) {
  .wrap { padding: 18px 14px 48px; }
  .table-head { grid-template-columns: 1fr 100px; }
  .table-head .col-offline { display: none; }
  .table-row  { grid-template-columns: 1fr 100px; }
  .table-row  .col-offline { display: none; }
  .completed-row { grid-template-columns: 1fr auto; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, computed } = Vue
const { createPinia, defineStore } = Pinia

/* ── Store ─────────────────────────────────────────────────────── */
const useReviewerStore = defineStore('reviewer', () => {

  const invitations = ref([
    { id: 1, title: 'Federated Learning con Privacidad Diferencial en Dispositivos Móviles', area: 'Machine Learning · Privacidad', deadline: '10 abr 2025', respondBy: '24 mar 2025', offlineAvailable: true },
    { id: 2, title: 'Detección Automática de Desinformación en Redes Sociales Mediante LLMs', area: 'NLP · Ética IA', deadline: '5 abr 2025', respondBy: '25 mar 2025', offlineAvailable: false },
  ])

  const activeReviews = ref([
    { id: 10, title: 'Optimización de Transformers para Inferencia en Dispositivos Edge', area: 'Deep Learning · Edge Computing', daysLeft: 1, progress: 65, offlineAvailable: true },
    { id: 11, title: 'Análisis de Sesgos en LLMs para Contextos Biomédicos en Español', area: 'NLP · Biomedicina', daysLeft: 2, progress: 30, offlineAvailable: true },
    { id: 12, title: 'Sistemas Multi-Agente para Coordinación de Drones en Búsqueda y Rescate', area: 'Robótica · Sistemas Multi-Agente', daysLeft: 14, progress: 0, offlineAvailable: false },
  ])

  const completedReviews = ref([
    { id: 20, title: 'Graph Neural Networks para Predicción de Interacciones Proteína-Fármaco', area: 'Bioinformática', completedAt: '14 mar 2025', verdict: 'Revisiones menores' },
    { id: 21, title: 'Ataques de Envenenamiento en Aprendizaje por Refuerzo con RLHF', area: 'Seguridad IA', completedAt: '2 mar 2025', verdict: 'Aceptar' },
    { id: 22, title: 'Compresión Neuronal Sin Pérdida para Modelos Fundacionales', area: 'ML Systems', completedAt: '18 feb 2025', verdict: 'Revisiones mayores' },
    { id: 23, title: 'Evaluación de Alucinaciones en LLMs para Generación de Código Clínico', area: 'LLMs · Salud', completedAt: '5 feb 2025', verdict: 'Rechazar' },
  ])

  const toasts = ref([])

  function pushToast(msg) {
    const id = Date.now()
    toasts.value.push({ id, msg })
    setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id) }, 3000)
  }

  function acceptInvitation(id) {
    const inv = invitations.value.find(i => i.id === id)
    if (!inv) return
    activeReviews.value.unshift({ id: Date.now(), title: inv.title, area: inv.area, daysLeft: 21, progress: 0, offlineAvailable: false })
    invitations.value = invitations.value.filter(i => i.id !== id)
    pushToast('Invitación aceptada. El artículo aparece en "En curso".')
  }

  function declineInvitation(id) {
    invitations.value = invitations.value.filter(i => i.id !== id)
    pushToast('Invitación declinada. El editor será notificado.')
  }

  return { invitations, activeReviews, completedReviews, toasts, acceptInvitation, declineInvitation }
})

/* ── Helpers ───────────────────────────────────────────────────── */
function deadlineClass(daysLeft) {
  if (daysLeft < 3) return 'urgent'
  if (daysLeft < 7) return 'warning'
  return 'ok'
}

function deadlineLabel(daysLeft) {
  if (daysLeft === 0) return 'Vence hoy'
  if (daysLeft === 1) return '1 día restante'
  return `${daysLeft} días restantes`
}

function verdictClass(verdict) {
  return { 'Aceptar': 'v-accept', 'Revisiones menores': 'v-minor', 'Revisiones mayores': 'v-major', 'Rechazar': 'v-reject' }[verdict] ?? ''
}

/* ── App ───────────────────────────────────────────────────────── */
const App = {
  setup() {
    const store = useReviewerStore()

    const offlineCount = computed(
      () => store.activeReviews.filter(r => r.offlineAvailable).length
          + store.invitations.filter(i => i.offlineAvailable).length
    )

    return { store, offlineCount, deadlineClass, deadlineLabel, verdictClass }
  },

  template: `
  <div class="wrap">

    <!-- Header -->
    <div class="topbar">
      <div class="brand">Dashboard del revisor</div>
      <div v-if="offlineCount > 0" class="offline-pill">
        <span class="offline-dot"></span>
        {{ offlineCount }} artículo{{ offlineCount !== 1 ? 's' : '' }} offline
      </div>
    </div>

    <!-- ── 1. Invitaciones pendientes ── -->
    <div class="section">
      <div class="section-label">
        Invitaciones pendientes
        <span v-if="store.invitations.length > 0" class="count-badge orange">{{ store.invitations.length }}</span>
      </div>

      <div v-if="store.invitations.length === 0" class="empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="empty-text">Sin invitaciones pendientes</span>
      </div>

      <div v-else class="cards-list">
        <div v-for="inv in store.invitations" :key="inv.id" class="inv-card">
          <div class="inv-title">{{ inv.title }}</div>
          <div class="inv-meta">
            <span class="chip">{{ inv.area }}</span>
            <span class="chip">Deadline: {{ inv.deadline }}</span>
            <span v-if="inv.offlineAvailable" class="chip chip-offline">
              <svg width="9" height="9" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
              Disponible offline
            </span>
          </div>
          <div class="inv-footer">
            <span class="respond-by">Responder antes del {{ inv.respondBy }}</span>
            <div class="inv-actions">
              <button class="btn-accept" @click="store.acceptInvitation(inv.id)">
                <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                Aceptar
              </button>
              <button class="btn-decline" @click="store.declineInvitation(inv.id)">
                <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                Declinar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 2. Revisiones en curso ── -->
    <div class="section">
      <div class="section-label">
        Revisiones en curso
        <span v-if="store.activeReviews.length > 0" class="count-badge blue">{{ store.activeReviews.length }}</span>
      </div>

      <div v-if="store.activeReviews.length === 0" class="empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <span class="empty-text">No tienes revisiones en curso</span>
      </div>

      <div v-else class="table-box">
        <div class="table-head">
          <span class="col-title">Artículo</span>
          <span class="col-deadline">Plazo</span>
          <span class="col-offline">Offline</span>
        </div>
        <div
          v-for="rev in store.activeReviews"
          :key="rev.id"
          class="table-row"
          :class="{ 'row-urgent': rev.daysLeft < 3 }"
        >
          <div class="col-title">
            <div class="rev-title">{{ rev.title }}</div>
            <div class="rev-area">{{ rev.area }}</div>
            <div v-if="rev.progress > 0" class="prog-wrap">
              <div class="prog-bar">
                <div class="prog-fill" :class="rev.daysLeft < 3 ? 'fill-urgent' : 'fill-normal'" :style="{ width: rev.progress + '%' }"></div>
              </div>
              <span class="prog-label">{{ rev.progress }}%</span>
            </div>
          </div>
          <div class="col-deadline">
            <span class="deadline-bar" :class="deadlineClass(rev.daysLeft)">
              <svg width="11" height="11" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
              {{ deadlineLabel(rev.daysLeft) }}
            </span>
          </div>
          <div class="col-offline">
            <span v-if="rev.offlineAvailable" class="offline-chip">
              <svg width="9" height="9" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
              Leer offline
            </span>
            <span v-else class="no-offline">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 3. Revisiones completadas ── -->
    <div class="section">
      <div class="section-label">
        Revisiones completadas
        <span v-if="store.completedReviews.length > 0" class="count-badge green">{{ store.completedReviews.length }}</span>
      </div>

      <div v-if="store.completedReviews.length === 0" class="empty">
        <span class="empty-text">Aún no has completado ninguna revisión</span>
      </div>

      <div v-else class="table-box">
        <div v-for="rev in store.completedReviews" :key="rev.id" class="table-row completed-row">
          <div class="col-title">
            <div class="rev-title">{{ rev.title }}</div>
            <div class="rev-area">{{ rev.area }} · {{ rev.completedAt }}</div>
          </div>
          <span class="verdict-badge" :class="verdictClass(rev.verdict)">{{ rev.verdict }}</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <Transition name="fade">
    <div v-if="store.toasts.length" class="toast-wrap">
      <div class="toast">{{ store.toasts[store.toasts.length - 1].msg }}</div>
    </div>
  </Transition>
  `
}

const app = createApp(App)
app.use(createPinia())
app.mount('#app')
</script>
</body>
</html>
