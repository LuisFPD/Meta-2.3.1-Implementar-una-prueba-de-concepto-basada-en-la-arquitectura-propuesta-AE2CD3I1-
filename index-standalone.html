<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel del Editor de Sección</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; font-size: 15px; }

.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }

/* Contadores */
.counters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
.counter-card { background: white; border-radius: 10px; padding: 16px; border: 1px solid #e5e5e5; }
.counter-label { font-size: 12px; color: #888; margin-bottom: 6px; }
.counter-value { font-size: 28px; font-weight: 600; }
.c-yellow { color: #f59e0b; }
.c-orange { color: #f97316; }
.c-green  { color: #22c55e; }

/* Lista manuscritos */
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 8px; }
.list-card { background: white; border-radius: 10px; border: 1px solid #e5e5e5; overflow: hidden; }
.ms-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; border-left: 3px solid transparent; }
.ms-item:last-child { border-bottom: none; }
.alert-sin-revisor { border-left-color: #a78bfa; background: #faf5ff; }
.alert-vencido     { border-left-color: #ef4444; background: #fff5f5; }
.alert-listo       { border-left-color: #22c55e; background: #f0fdf4; }
.ms-main { flex: 1; min-width: 0; }
.ms-title { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms-meta { font-size: 12px; color: #888; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.dot { color: #ccc; }
.btn-asignar { flex-shrink: 0; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: white; color: #374151; cursor: pointer; white-space: nowrap; }
.btn-asignar:hover { background: #f9fafb; }
.empty { padding: 24px 16px; text-align: center; color: #aaa; font-size: 13px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal { background: white; border-radius: 12px; width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.modal-header { padding: 18px 20px 14px; border-bottom: 1px solid #f0f0f0; }
.modal-header h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.modal-ms-name { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-body { padding: 8px 0; max-height: 320px; overflow-y: auto; }
.reviewer-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; cursor: pointer; }
.reviewer-item:hover { background: #f9fafb; }
.reviewer-item.selected { background: #f0fdf4; }
.rv-avatar { width: 34px; height: 34px; border-radius: 50%; background: #e0e7ff; color: #3b82f6; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rv-info { flex: 1; min-width: 0; }
.rv-name { font-size: 14px; font-weight: 500; }
.rv-area { font-size: 11px; color: #aaa; margin-top: 1px; }
.rv-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; color: white; }
.reviewer-item.selected .rv-check { background: #22c55e; border-color: #22c55e; }
.modal-footer { padding: 14px 20px; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel  { font-size: 13px; padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: white; color: #374151; cursor: pointer; }
.btn-cancel:hover { background: #f9fafb; }
.btn-confirm { font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: none; background: #3b82f6; color: white; cursor: pointer; }
.btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-confirm:not(:disabled):hover { background: #2563eb; }

@media (max-width: 520px) {
  .counters-grid { grid-template-columns: 1fr 1fr; }
  .counter-value { font-size: 24px; }
  .ms-item { flex-direction: column; align-items: flex-start; }
  .btn-asignar { align-self: flex-end; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>window.VueDemi = Vue</script>
<script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.js"></script>
<script>
const { createApp, computed, ref } = Vue
const { createPinia, defineStore } = Pinia

const useStore = defineStore('editorial', () => {
  const manuscritos = Vue.ref([
    { id: 1, titulo: 'Redes Neuronales Cuánticas para Criptografía Post-Cuántica',  estado: 'en_proceso',        revisores_asignados: 1, revisores_requeridos: 3, ultimo_movimiento: '2026-02-18', revision_vencida: false },
    { id: 2, titulo: 'Detección de Anomalías en Sistemas SCADA',                     estado: 'listo_decidir',      revisores_asignados: 3, revisores_requeridos: 3, ultimo_movimiento: '2026-03-15', revision_vencida: false },
    { id: 3, titulo: 'Políticas de Privacidad Diferencial en Sistemas de Salud',     estado: 'en_proceso',        revisores_asignados: 1, revisores_requeridos: 3, ultimo_movimiento: '2026-03-01', revision_vencida: false },
    { id: 4, titulo: 'Arquitecturas Transformer para Series Temporales en Finanzas', estado: 'en_proceso',        revisores_asignados: 0, revisores_requeridos: 2, ultimo_movimiento: '2026-03-19', revision_vencida: false },
    { id: 5, titulo: 'Microbioma Intestinal y Trastornos del Espectro Autista',      estado: 'en_proceso',        revisores_asignados: 2, revisores_requeridos: 3, ultimo_movimiento: '2026-02-20', revision_vencida: true  },
    { id: 6, titulo: 'Síntesis de Nanomateriales 2D para Supercapacitores',          estado: 'pendiente_decision', revisores_asignados: 3, revisores_requeridos: 3, ultimo_movimiento: '2026-03-08', revision_vencida: false },
  ])

  const revisores = Vue.ref([
    { id: 1, nombre: 'Oscar Leonel Rodriguez Araujo',   area: 'Product Owner', initials: 'LA' },
    { id: 2, nombre: 'Axel Eduardo Jimenez Perez',    area: 'Developer',     initials: 'AJ' },
    { id: 3, nombre: 'Eduardo Hurtado Quintero',     area: 'Developer', initials: 'EQ' },
    { id: 4, nombre: 'Luis Fernando Prieto Duarte',     area: 'Scrum Master',            initials: 'LP' },
    { id: 5, nombre: 'Luz María Jacobo Aldrete', area: 'Developer',      initials: 'MA' },
    { id: 6, nombre: 'Ricardo Emmanuel Romo Ruiz', area: 'Developer',    initials: 'RR' },
  ])

  function asignarRevisor(manuscritoId) {
    const m = manuscritos.value.find(m => m.id === manuscritoId)
    if (m) m.revisores_asignados = Math.min(m.revisores_asignados + 1, m.revisores_requeridos)
  }

  return { manuscritos, revisores, asignarRevisor }
})

const App = {
  setup() {
    const store = useStore()

    const modalAbierto = ref(false)
    const manuscritoActivo = ref(null)
    const revisorSeleccionado = ref(null)

    function abrirModal(m) {
      manuscritoActivo.value = m
      revisorSeleccionado.value = null
      modalAbierto.value = true
    }

    function cerrarModal() {
      modalAbierto.value = false
      manuscritoActivo.value = null
      revisorSeleccionado.value = null
    }

    function confirmarAsignacion() {
      if (!revisorSeleccionado.value || !manuscritoActivo.value) return
      store.asignarRevisor(manuscritoActivo.value.id)
      cerrarModal()
    }

    const contadores = computed(() => ({
      enProceso:          store.manuscritos.filter(m => m.estado === 'en_proceso').length,
      pendientesDecision: store.manuscritos.filter(m => m.estado === 'pendiente_decision').length,
      listosDecidir:      store.manuscritos.filter(m => m.estado === 'listo_decidir').length,
    }))

    function alertClass(m) {
      if (m.revisores_asignados === 0)  return 'alert-sin-revisor'
      if (m.revision_vencida)           return 'alert-vencido'
      if (m.estado === 'listo_decidir') return 'alert-listo'
      return ''
    }

    function estadoLabel(estado) {
      return { en_proceso: 'En proceso', pendiente_decision: 'Pendiente de decisión', listo_decidir: 'Listo para decidir' }[estado] ?? estado
    }

    function fmtDate(fecha) {
      if (!fecha) return '—'
      return new Date(fecha).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' })
    }

    return { store, contadores, alertClass, estadoLabel, fmtDate, modalAbierto, manuscritoActivo, revisorSeleccionado, abrirModal, cerrarModal, confirmarAsignacion }
  },

  template: `
<div class="container">
  <h1>Panel del Editor de Sección</h1>

  <div class="counters-grid">
    <div class="counter-card">
      <div class="counter-label">En proceso</div>
      <div class="counter-value c-yellow">{{ contadores.enProceso }}</div>
    </div>
    <div class="counter-card">
      <div class="counter-label">Pendientes de decisión</div>
      <div class="counter-value c-orange">{{ contadores.pendientesDecision }}</div>
    </div>
    <div class="counter-card">
      <div class="counter-label">Listos para decidir</div>
      <div class="counter-value c-green">{{ contadores.listosDecidir }}</div>
    </div>
  </div>

  <div class="section-title">Mis manuscritos</div>
  <div class="list-card">
    <div v-if="store.manuscritos.length === 0" class="empty">Sin manuscritos asignados</div>
    <div v-for="m in store.manuscritos" :key="m.id" class="ms-item" :class="alertClass(m)">
      <div class="ms-main">
        <div class="ms-title">{{ m.titulo }}</div>
        <div class="ms-meta">
          <span>{{ estadoLabel(m.estado) }}</span>
          <span class="dot">·</span>
          <span>Revisores: {{ m.revisores_asignados }}/{{ m.revisores_requeridos }}</span>
          <span class="dot">·</span>
          <span>Último mov. {{ fmtDate(m.ultimo_movimiento) }}</span>
        </div>
      </div>
      <button class="btn-asignar" @click="abrirModal(m)">+ Asignar revisor</button>
    </div>
  </div>
</div>

<div v-if="modalAbierto" class="modal-overlay" @click.self="cerrarModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>Asignar revisor</h2>
      <div class="modal-ms-name">{{ manuscritoActivo?.titulo }}</div>
    </div>
    <div class="modal-body">
      <div
        v-for="r in store.revisores"
        :key="r.id"
        class="reviewer-item"
        :class="{ selected: revisorSeleccionado === r.id }"
        @click="revisorSeleccionado = r.id"
      >
        <div class="rv-avatar">{{ r.initials }}</div>
        <div class="rv-info">
          <div class="rv-name">{{ r.nombre }}</div>
          <div class="rv-area">{{ r.area }}</div>
        </div>
        <div class="rv-check">{{ revisorSeleccionado === r.id ? '✓' : '' }}</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" @click="cerrarModal()">Cancelar</button>
      <button class="btn-confirm" :disabled="!revisorSeleccionado" @click="confirmarAsignacion()">Confirmar</button>
    </div>
  </div>
</div>
  `
}

const app = createApp(App)
app.use(createPinia())
app.mount('#app')
</script>
</body>
</html>
